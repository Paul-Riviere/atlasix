[tools]
node = "25"
python = "3.12"
uv = "0.11.21"
"pipx:graphifyy" = "0.9.67"
biome = "2.5.15"
"npm:markdownlint-cli2" = "latest"

[settings]
experimental = true
python.uv_venv_auto = "create|source"

[env]
_.python.venv = { path = ".venv", create = true }

[hooks]
enter = { task = "install" }

[tasks.install]
description = "Install npm dependencies"
run = [
    { task = "install-npm" },
    { task = "install-python" }
]

[tasks.install-python]
description = "Install Python dependencies"
alias = "i"
run = "uv venv --allow-existing && uv pip install -r requirements.txt"

[tasks.install-npm]
description = "Install npm dependencies"
run = "npm install"

[tasks.build]
description = "Build the distributable files"
depends = ["install-npm"]
run = "npm run build"

[tasks.zensical-build]
description = "Build Zensical website"
depends = ["install"]
run = [
    { task = "build" },
    "mkdir -p docs/assets/atlasix && cp -r dist/* docs/assets/atlasix/",
    "zensical build --clean --strict"
]

[tasks.zensical-serve]
description = "Run Zensical locally"
depends = ["install"]
run = [
    { task = "build" },
    "mkdir -p docs/assets/atlasix && cp -r dist/* docs/assets/atlasix/",
    "zensical serve"
]

[tasks.lint]
description = "Lint TS, CSS, HTML, JSON and Markdown"
depends = ["install-npm"]
run = [
    "npx tsc --noEmit",
    "biome check .",
    "markdownlint-cli2"
]

[tasks."lint:fix"]
description = "Auto-fix lint and format issues"
run = [
    "biome check --write .",
    "markdownlint-cli2 --fix"
]
