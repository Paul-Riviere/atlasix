[project]
site_name = "Atlasix Documentation"
site_description = "Create interactive web schemas as code with Atlasix."
site_url = "https://paul-riviere.github.io/atlasix/"
language = "en"
extra_css = [
  "assets/atlasix/atlasix.css",
]
extra_javascript = [
  { path = "assets/atlasix/atlasix.js", type = "module" }
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
